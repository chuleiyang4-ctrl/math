<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Mathematics</title>
  <link rel="stylesheet" href="course-common.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .auth-container h1 {
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .auth-container .subtitle {
      color: #666;
      margin-bottom: 32px;
    }
    .auth-container input {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .auth-container input:focus {
      outline: none;
      border-color: #4A90D9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.1);
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #2C3E50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-btn:hover {
      background: #1a2632;
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .auth-footer a {
      color: #4A90D9;
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .message.error {
      display: block;
      background: #fee;
      color: #c0392b;
      border: 1px solid #fcc;
    }
    .message.success {
      display: block;
      background: #eafaf1;
      color: #27ae60;
      border: 1px solid #b9e6d0;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>∑ Mathematics</h1>
    <p class="subtitle">Sign in to access your courses</p>
    
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      
      <button type="submit" class="auth-btn">Sign In</button>
    </form>
    
    <div id="message" class="message"></div>
    
    <div class="auth-footer">
      Don't have an account? <a href="#" id="showRegister">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      messageEl.textContent = '';
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });
      
      if (error) {
        messageEl.className = 'message error';
        messageEl.textContent = 'Login failed: ' + error.message;
      } else {
        messageEl.className = 'message success';
        messageEl.textContent = '✓ Signed in successfully! Redirecting...';
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 800);
      }
    });
    
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      // For now, prompt to create account via Supabase Dashboard
      // You can replace this with a registration page later
      alert('To create an account, please contact the administrator or use the Supabase Dashboard to add a user.');
    });
  </script>
</body>
</html>
